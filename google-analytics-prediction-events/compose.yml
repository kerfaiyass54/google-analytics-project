services:
  prediction-events:
    build:
      context: ./google-analytics-prediction-events
    container_name: analytics_prediction_events
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PREDICTION_TOPIC: prediction-events
      KAFKA_EVALUATION_TOPIC: evaluation-events
      KAFKA_CONSUMER_GROUP: prediction-dashboard
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EVENTS_INDEX: prediction_dashboard_events
      EVALUATIONS_INDEX: prediction_model_evaluations
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8280/realms/google-analytics}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://host.docker.internal:8280/realms/google-analytics/protocol/openid-connect/certs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-google-analytics-api}
      ADMIN_ROLE: ADMIN
    ports:
      - "8020:8020"
    depends_on:
      - postgres
      - kafka
      - elasticsearch
    networks:
      - backend
