server:
  port: ${SERVER_PORT:8040}
spring:
  application:
    name: identity-management-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5540/analyticsforgoogle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8280/realms/google-analytics}
management:
  endpoints:
    web:
      exposure:
        include: health,info
identity:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8280}
    realm: ${KEYCLOAK_REALM:google-analytics}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:analytics-identity-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    sync-interval-ms: ${KEYCLOAK_SYNC_INTERVAL_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
