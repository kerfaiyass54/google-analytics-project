services:
  notification-service:
    build:
      context: ./notification-service
    container_name: analytics_notification_service
    restart: unless-stopped
    environment:
      PORT: 8030
      CORS_ORIGINS: http://localhost:4200
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ADMIN_DB: postgres
      NOTIFICATIONS_DB: notifications_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_NOTIFICATION_TOPICS: application-events,eda-events,evaluation-events,model-events
      KAFKA_NOTIFICATION_GROUP: analytics-notifications-v1
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8280/realms/google-analytics}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://host.docker.internal:8280/realms/google-analytics/protocol/openid-connect/certs}
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
