# ============================================================
# APPLICATION
# ============================================================

spring.application.name=analyticsforgoogle
server.port=8880


# ============================================================
# KEYCLOAK
# ============================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/realms/google-analytics
spring.security.oauth2.resourceserver.jwt.audiences=google-analytics-api


# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5540/analyticsforgoogle
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# KAFKA
# ============================================================

spring.kafka.bootstrap-servers=localhost:9099

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=analyticsforgoogle
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*