<section class="statistics-section">
  <header class="section-header">
    <div class="section-icon">
      <i class="bi bi-currency-dollar"></i>
    </div>

    <div>
      <h2>Price Statistics</h2>
      <p>Minimum, average, and maximum application price</p>
    </div>
  </header>

  <div class="statistics-grid">
    <article class="stat-card minimum-card">
      <div class="stat-icon">
        <i class="bi bi-arrow-down"></i>
      </div>

      <div class="stat-content">
        <span class="stat-label">Minimum Price</span>

        <strong class="stat-value">
          ${{ minimum() | number:'1.2-2' }}
        </strong>
      </div>
    </article>

    <article class="stat-card average-card">
      <div class="stat-icon">
        <i class="bi bi-bar-chart-line-fill"></i>
      </div>

      <div class="stat-content">
        <span class="stat-label">Average Price</span>

        <strong class="stat-value">
          ${{ average() | number:'1.2-2' }}
        </strong>
      </div>
    </article>

    <article class="stat-card maximum-card">
      <div class="stat-icon">
        <i class="bi bi-arrow-up"></i>
      </div>

      <div class="stat-content">
        <span class="stat-label">Maximum Price</span>

        <strong class="stat-value">
          ${{ maximum() | number:'1.2-2' }}
        </strong>
      </div>
    </article>
  </div>
</section>
