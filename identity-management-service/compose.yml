services:
  identity-management-service:
    build: .
    container_name: analytics_identity_management
    restart: unless-stopped
    environment:
      SERVER_PORT: 8040
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analyticsforgoogle}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/google-analytics
      KEYCLOAK_REALM: google-analytics
      KEYCLOAK_ADMIN_CLIENT_ID: analytics-identity-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_IDENTITY_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8040:8040"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    external: true
