<app-sidebar-page
  [items]="sidebarItems"
/>

<main class="developer-tools-page">

  <!-- =========================================================
       OVERVIEW
       ========================================================= -->

  <section
    id="developer-overview"
    class="developer-section"
  >
    <div class="section-header">
      <span class="section-icon">
        <i class="bi bi-speedometer2"></i>
      </span>

      <div>
        <span class="section-eyebrow">DEVELOPER TOOLS</span>
        <h1>Overview</h1>
        <p>Development and analytics overview.</p>
      </div>
    </div>

    <!-- Your overview content -->
  </section>


  <!-- =========================================================
       APPLICATIONS
       ========================================================= -->

  <section
    id="developer-applications"
    class="developer-section"
  >
    <div class="section-header">
      <span class="section-icon">
        <i class="bi bi-grid-3x3-gap-fill"></i>
      </span>

      <div>
        <span class="section-eyebrow">DATA</span>
        <h2>Applications</h2>
        <p>Google Play Store applications.</p>
      </div>
    </div>

    <app-paginated-table
      title="Google Play Applications"
      [columns]="columns"
      [response]="tableResponse()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
    />
  </section>


  <!-- =========================================================
       STATISTICS
       ========================================================= -->

  <section
    id="developer-statistics"
    class="developer-section"
  >
    <div class="section-header">
      <span class="section-icon">
        <i class="bi bi-bar-chart-fill"></i>
      </span>

      <div>
        <span class="section-eyebrow">METRICS</span>
        <h2>Statistics</h2>
        <p>Application statistics and metrics.</p>
      </div>
    </div>

    <!-- Statistics content -->
  </section>


  <!-- =========================================================
       ANALYTICS
       ========================================================= -->

  <section
    id="developer-analytics"
    class="developer-section"
  >
    <div class="section-header">
      <span class="section-icon">
        <i class="bi bi-graph-up-arrow"></i>
      </span>

      <div>
        <span class="section-eyebrow">ANALYTICS</span>
        <h2>Analytics</h2>
        <p>Advanced application analytics.</p>
      </div>
    </div>

    <!-- Analytics content -->
  </section>

</main>
